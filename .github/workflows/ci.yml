name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - uses: actions/upload-artifact@v7
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 1
      - run: |
          echo LOCK_BEGIN
          base64 -w0 pnpm-lock.yaml
          echo
          echo LOCK_END
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

