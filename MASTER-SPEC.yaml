  # ============================================================================
  # 51 — JOURNEY ACCEPTANCE CRITERIA
  # ============================================================================

  journey_acceptance:

    builder:
      - "user can create journey visually"
      - "user can add multiple messages"
      - "user can connect nodes"
      - "user can create branches"
      - "user can add waits"
      - "user can configure conditions"
      - "user can define goals"
      - "invalid journey cannot be published"

    runtime:
      - "contact can enter journey"
      - "each contact has independent state"
      - "contact can wait"
      - "contact can resume from event"
      - "contact can follow conditional branch"
      - "contact can receive next message"
      - "duplicate event does not duplicate advancement"
      - "worker restart does not lose state"
      - "Redis interruption does not permanently lose journey state"
      - "opt-out prevents future applicable messages"

    provider:
      - "journey uses canonical events"
      - "provider adapter normalizes events"
      - "unsupported condition is blocked before publish"

    scoring:
      - "behavior can alter score"
      - "score history is auditable"
      - "score can trigger branch"
      - "score can trigger goal"

    external:
      - "goal can trigger secure webhook"
      - "qualified lead can be sent to external CRM"


  # ============================================================================
  # 52 — DEFINITION OF DONE
  # ============================================================================

  definition_of_done:

    campaign:
      - "create"
      - "send"
      - "schedule"
      - "track"

    journey:
      - "create"
      - "visually design"
      - "validate"
      - "publish"
      - "enroll contacts"
      - "execute multiple messages"
      - "wait"
      - "react to events"
      - "branch"
      - "score"
      - "reach goal"
      - "complete"
      - "analyze"

    workspace:
      - "resources isolated"
      - "RBAC enforced"

    providers:
      - "official docs reviewed"
      - "adapter tested"
      - "capabilities mapped"
      - "webhooks validated"

    security:
      - "credentials encrypted"
      - "tenant isolation tested"
      - "webhooks verified"
      - "journey duplicate execution protected"
      - "SSRF protection implemented"
      - "security tests passing"

    documentation:
      - "README complete"
      - "journey documentation complete"
      - "provider documentation complete"
      - "VPS installation complete"
      - "security documentation complete"

    local_requires_Docker: false


  # ============================================================================
  # 53 — FINAL EXECUTION CONTRACT
  # ============================================================================

  final_execution_contract:

    source_of_truth:
      file: "MASTER-SPEC.yaml"
      version: "6.0.0"

    precedence:
      1: "security"
      2: "workspace isolation"
      3: "official provider contracts"
      4: "data integrity"
      5: "canonical domain contracts"
      6: "journey execution integrity"
      7: "provider abstraction"
      8: "product requirements"
      9: "architecture"
      10: "design system"
      11: "documentation"
      12: "wave requirements"

    campaign_rule: >
      Campaign é o mecanismo de envio direto.

    journey_rule: >
      Journey é o mecanismo de automação multi-etapas
      baseado em estado individual do contato.

    state_rule: >
      PostgreSQL é a fonte persistente de verdade
      para o estado crítico da Journey.

    event_rule: >
      Eventos específicos de provider devem ser normalizados
      antes de entrar no Journey Engine.

    capability_rule: >
      Nenhuma condição dependente de capability externa
      pode ser publicada sem suporte validado.

    loop_rule: >
      Nenhuma Journey pode possuir loop infinito
      ou execução ilimitada não controlada.

    opt_out_rule: >
      Opt-out deve impedir imediatamente novos envios
      aplicáveis em Campaigns e Journeys.

    tenant_rule: >
      Nenhum dado, evento, job, webhook, mídia,
      Journey ou Campaign pode atravessar Workspaces.

    provider_rule: >
      Providers são infraestrutura substituível.

    documentation_rule: >
      Documentação oficial atual é autoridade
      para integrações externas.

    security_rule: >
      Segurança não pode ser desabilitada para
      simplificar implementação.

    local_rule: >
      Docker não é requisito para desenvolvimento local.

    final_principle: >
      Build a professional, secure, workspace-first,
      provider-independent RCS platform supporting both
      simple campaigns and behavior-driven automated journeys,
      while preserving individual contact state, provider
      abstraction, tenant isolation, operational reliability,
      maintainability and complete documentation.
