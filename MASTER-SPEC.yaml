# ==============================================================================
# RCS SENDER
# MASTER SPEC-DRIVEN DEVELOPMENT
# VERSION 6.0.0
# ==============================================================================
#
# STATUS: EXECUTION READY
#
# SINGLE SOURCE OF TRUTH:
#   MASTER-SPEC.yaml
#
# PRODUCT PRINCIPLE:
#   SIMPLE OUTSIDE. ROBUST INSIDE.
#
# DEVELOPMENT MODEL:
#
#   SPEC
#     -> WAVE
#     -> INSPECT
#     -> OFFICIAL DOCS
#     -> PLAN
#     -> IMPLEMENT
#     -> TEST
#     -> SECURITY CHECK
#     -> FIX
#     -> VALIDATE
#     -> DOCUMENT
#     -> CLOSE WAVE
#
# ==============================================================================

spec:

  # ============================================================================
  # 00 — METADATA
  # ============================================================================

  metadata:

    project_name: "RCS Sender"
    version: "6.0.0"
    status: "execution_ready"

    default_language: "pt-BR"
    initial_market: "Brazil"

    source_of_truth:
      file: "MASTER-SPEC.yaml"
      authoritative: true

    methodologies:
      - "Spec Driven Development"
      - "Wave Based Development"
      - "Validation Loops"
      - "Contract Testing"
      - "Security by Design"
      - "Documentation as Code"
      - "Official Documentation First"
      - "Workspace First Architecture"
      - "Event Driven Architecture"

    change_policy:

      full_rewrite_required: true

      rule: >
        Toda alteração arquitetural, funcional, operacional,
        de segurança ou integração relevante deve ser consolidada
        neste MASTER-SPEC.

        Não manter patches permanentes ou documentos contraditórios.

        MASTER-SPEC.yaml deve sempre representar o estado completo,
        atual e executável do produto.


  # ============================================================================
  # 01 — PRODUCT VISION
  # ============================================================================

  product:

    name: "RCS Sender"

    vision: >
      Plataforma profissional para criação, gerenciamento,
      envio, acompanhamento e automação de comunicação RCS,
      utilizando múltiplos provedores.

    positioning: >
      Camada independente de criação, orquestração e automação
      de mensagens RCS, desacoplada dos fornecedores
      de infraestrutura.

    product_modes:

      campaign:
        description: >
          Envio simples ou agendado de uma mensagem para
          determinada audiência.

      journey:
        description: >
          Fluxo automatizado composto por múltiplas mensagens,
          condições, esperas, eventos, ações e objetivos.

    architecture_style:
      application: "modular_monolith"
      integrations: "ports_and_adapters"
      bulk_processing: "asynchronous"
      automation: "event_driven"
      providers: "multi_provider"
      tenancy: "workspace_first"

    principles:
      - "Provider independent"
      - "Workspace isolated"
      - "Secure by default"
      - "Campaign driven"
      - "Journey capable"
      - "Event driven"
      - "Async by default for bulk work"
      - "Observable"
      - "Recoverable"
      - "Maintainable"
      - "Simple UI"
      - "Official documentation is authority for external contracts"
      - "No provider logic leaking into domain"
      - "No cross-workspace data leakage"


  # ============================================================================
  # 02 — PRODUCT SCOPE
  # ============================================================================

  scope:

    core:
      authentication: true
      workspaces: true
      workspace_members: true
      dashboard: true
      contacts: true
      audiences: true
      message_library: true
      message_builder: true
      campaigns: true
      journeys: true
      visual_flow_builder: true
      journey_engine: true
      conditions: true
      waits: true
      lead_scoring: true
      integrations: true
      provider_agents: true
      webhook_processing: true
      analytics: true
      inbox_lite: true
      audit: true

    architecture_ready:
      - "A/B testing"
      - "advanced segmentation"
      - "automatic provider routing"
      - "cost based routing"
      - "provider failover"
      - "AI message generation"
      - "AI reply assistance"
      - "advanced conversational inbox"
      - "public API"
      - "billing per workspace"
      - "agency mode"

    explicitly_not_core:
      - "full CRM"
      - "email marketing suite"
      - "full WhatsApp platform"
      - "generic chatbot builder"
      - "omnichannel CRM"
      - "native mobile app"


  # ============================================================================
  # 03 — CORE PRODUCT MODEL
  # ============================================================================

  core_product_model:

    campaign:

      purpose: >
        Executar envio direto de uma mensagem para uma audiência.

      example:
        flow:
          - "Audience"
          - "Message"
          - "Preflight"
          - "Send"
          - "Track"

    journey:

      purpose: >
        Conduzir individualmente cada contato por um fluxo
        automatizado baseado em eventos, tempo, comportamento
        e condições.

      example:
        flow:
          - "Entry"
          - "Message"
          - "Wait"
          - "Condition"
          - "Branch"
          - "Message"
          - "Goal"

    critical_rule: >
      Campaign e Journey são domínios relacionados,
      porém não são a mesma entidade.

      Campaign não deve ser artificialmente transformada
      em Journey.

      O usuário deve continuar podendo realizar
      um disparo simples sem utilizar Flow Builder.


  # ============================================================================
  # 04 — TENANCY MODEL
  # ============================================================================

  tenancy:

    model: "workspace_first"

    principle: >
      Recursos operacionais pertencem ao Workspace.

      Usuários acessam Workspaces através de memberships.

    initial_behavior: >
      Primeiro cadastro cria automaticamente
      um Workspace padrão.

    relationships:
      user_to_workspace: "many_to_many"
      workspace_to_resources: "one_to_many"

    workspace_owned_resources:
      - "contacts"
      - "contact_lists"
      - "messages"
      - "message_versions"
      - "media_assets"
      - "campaigns"
      - "campaign_recipients"
      - "journeys"
      - "journey_versions"
      - "journey_nodes"
      - "journey_edges"
      - "journey_enrollments"
      - "journey_events"
      - "lead_scores"
      - "lead_score_events"
      - "provider_connections"
      - "provider_credentials"
      - "provider_agents"
      - "provider_capabilities"
      - "outbound_messages"
      - "inbound_messages"
      - "conversations"
      - "tracked_links"
      - "click_events"
      - "webhook_events"
      - "opt_outs"
      - "analytics"

    isolation:
      mandatory: true
      server_side: true
      fail_closed: true

    forbidden:
      - "cross_workspace_query_without_system_scope"
      - "frontend_only_authorization"
      - "trusting client workspace_id without membership validation"


  # ============================================================================
  # 05 — USERS / WORKSPACES / RBAC
  # ============================================================================

  users:

    fields:
      - "id"
      - "name"
      - "email"
      - "password_hash"
      - "status"
      - "created_at"
      - "updated_at"

  workspaces:

    fields:
      - "id"
      - "name"
      - "slug"
      - "status"
      - "created_by_user_id"
      - "created_at"
      - "updated_at"

  workspace_members:

    roles:

      owner:
        permissions:
          - "*"

      admin:
        permissions:
          - "providers.manage"
          - "contacts.manage"
          - "messages.manage"
          - "campaigns.manage"
          - "campaigns.send"
          - "journeys.manage"
          - "journeys.publish"
          - "analytics.view"

      operator:
        permissions:
          - "contacts.manage"
          - "messages.manage"
          - "campaigns.manage"
          - "campaigns.send"
          - "journeys.manage"
          - "journeys.publish"
          - "analytics.view"

      viewer:
        permissions:
          - "contacts.view"
          - "messages.view"
          - "campaigns.view"
          - "journeys.view"
          - "analytics.view"


  # ============================================================================
  # 06 — NAVIGATION
  # ============================================================================

  navigation:

    workspace_selector:
      enabled: true

    items:

      - id: "dashboard"
        label: "Dashboard"

      - id: "contacts"
        label: "Contatos"

      - id: "campaigns"
        label: "Campanhas"

      - id: "journeys"
        label: "Jornadas"

      - id: "messages"
        label: "Mensagens"

      - id: "conversations"
        label: "Conversas"

      - id: "integrations"
        label: "Integrações"

      - id: "settings"
        label: "Configurações"


  # ============================================================================
  # 07 — TECHNOLOGY STACK
  # ============================================================================

  technology:

    monorepo:
      package_manager: "pnpm"

    frontend:
      framework: "Next.js"
      runtime: "React"
      language: "TypeScript"
      router: "App Router"

      styling: "Tailwind CSS"
      components: "shadcn/ui"
      icons: "Lucide"

      server_state: "TanStack Query"
      local_state: "Zustand"

      forms: "React Hook Form"
      validation: "Zod"

      internationalization:
        library: "next-intl"
        default: "pt-BR"
        ready_for:
          - "en"
          - "es"

    backend:
      runtime: "Node.js"
      language: "TypeScript"
      API_style: "REST"
      validation: "Zod"

    database:
      engine: "PostgreSQL"
      hosting: "self_hosted_VPS"

    queue:
      broker: "Redis"
      engine: "BullMQ"

    flow_builder:

      rendering:
        requirement: >
          Utilizar biblioteca madura de node-based editor
          compatível com React/Next.js.

      selection_policy: >
        Antes da implementação, verificar documentação,
        manutenção, licença, acessibilidade e compatibilidade
        das bibliotecas atuais.

        Não selecionar biblioteca exclusivamente por memória.

    observability:
      logs: "Pino"
      errors: "Sentry"
      tracing: "OpenTelemetry compatible"
      metrics: "Prometheus compatible"

    tests:
      unit: "Vitest"
      integration: "Vitest"
      E2E: "Playwright"


  # ============================================================================
  # 08 — LOCAL DEVELOPMENT
  # ============================================================================

  local_development:

    docker_required: false
    docker_desktop_required: false

    required:
      - "Git"
      - "Node.js LTS"
      - "pnpm"

    principle: >
      Aplicação deve ser desenvolvível sem Docker local.

    production_target:
      type: "VPS"


  # ============================================================================
  # 09 — REPOSITORY ARCHITECTURE
  # ============================================================================

  repository:

    type: "monorepo"

    structure:

      apps:

        web:
          purpose: "User interface"

        api:
          purpose: "Application API"

        worker:
          purpose: "Background processing"

      packages:

        database:
          purpose: "Database and migrations"

        rcs_core:
          purpose: "Canonical RCS contracts"

        rcs_providers:
          purpose: "Provider adapters"

        messaging:
          purpose: "Message domain"

        campaigns:
          purpose: "Campaign domain"

        journeys:
          purpose: "Journey domain"

        journey_engine:
          purpose: "Journey execution"

        scoring:
          purpose: "Lead scoring"

        events:
          purpose: "Canonical application events"

        media:
          purpose: "Media handling"

        queue:
          purpose: "Queue abstractions"

        security:
          purpose: "Security utilities"

        validation:
          purpose: "Shared validation"

        observability:
          purpose: "Logs metrics tracing"

        ui:
          purpose: "Shared design system"

        config:
          purpose: "Typed configuration"

    backend_modules:
      - "auth"
      - "users"
      - "workspaces"
      - "memberships"
      - "contacts"
      - "audiences"
      - "messages"
      - "media"
      - "campaigns"
      - "journeys"
      - "journey_runtime"
      - "scoring"
      - "events"
      - "providers"
      - "agents"
      - "webhooks"
      - "conversations"
      - "tracking"
      - "optout"
      - "analytics"
      - "audit"

    forbidden:
      - "large main.ts business logic"
      - "God services"
      - "God controllers"
      - "provider logic inside journey engine"
      - "provider logic inside campaign engine"
      - "database queries inside React components"
      - "provider API calls from browser"


  # ============================================================================
  # 10 — MODULE STANDARD
  # ============================================================================

  module_standard:

    layers:

      domain:
        - "entities"
        - "value_objects"
        - "domain_events"
        - "ports"

      application:
        - "commands"
        - "queries"
        - "use_cases"
        - "DTOs"

      infrastructure:
        - "repositories"
        - "database"
        - "external_adapters"

      presentation:
        - "controllers"
        - "routes"
        - "schemas"

    maintainability:
      target_file_lines: 300
      mandatory_review_over_lines: 500


  # ============================================================================
  # 11 — PROVIDER INDEPENDENCE
  # ============================================================================

  provider_model:

    provider_lock_in: false

    initial_targets:
      - "google_rbm"
      - "infobip"
      - "twilio"
      - "sinch"
      - "zenvia"

    principle: >
      Campaign Engine e Journey Engine nunca dependem
      diretamente de provider específico.


  # ============================================================================
  # 12 — RCS PROVIDER PORT
  # ============================================================================

  rcs_provider_port:

    interface: "RcsProvider"

    connection:
      - "validateCredentials"
      - "testConnection"
      - "getConnectionStatus"

    agents:
      - "listAgents"
      - "getAgent"
      - "getAgentCapabilities"

    recipients:
      optional:
        - "checkEligibility"
        - "getCapabilities"

    messaging:
      required:
        - "send"

      optional:
        - "revoke"
        - "getMessageStatus"

    webhooks:
      - "verifyWebhook"
      - "parseWebhook"
      - "normalizeEvent"

    billing:
      optional:
        - "estimateCost"

    health:
      - "getHealth"


  # ============================================================================
  # 13 — OFFICIAL DOCUMENTATION FIRST
  # ============================================================================

  provider_documentation_policy:

    mandatory: true
    blocking: true

    principle: >
      Antes de implementar ou alterar integração externa,
      consultar documentação oficial atual.

      Nunca inventar endpoints, payloads, autenticação,
      webhook signatures, limites, eventos ou capabilities.

    authority_order:
      1: "official API reference"
      2: "official provider documentation"
      3: "official SDK documentation"
      4: "official security documentation"
      5: "official changelog"
      6: "official examples"

    providers:
      - "Google RCS for Business"
      - "Infobip"
      - "Twilio"
      - "Sinch"
      - "Zenvia"
      - "future providers"


  # ============================================================================
  # 14 — PROVIDER RESEARCH
  # ============================================================================

  provider_research:

    verify:
      - "API base URL"
      - "API version"
      - "authentication"
      - "credentials"
      - "agents"
      - "message formats"
      - "rich cards"
      - "carousels"
      - "media"
      - "suggested replies"
      - "suggested actions"
      - "events"
      - "delivery receipts"
      - "read receipts"
      - "inbound messages"
      - "action events"
      - "eligibility"
      - "capabilities"
      - "webhooks"
      - "webhook signatures"
      - "retries"
      - "rate limits"
      - "quotas"
      - "errors"
      - "TTL"
      - "billing"
      - "opt-in"
      - "opt-out"
      - "regional restrictions"


  # ============================================================================
  # 15 — PROVIDER EVIDENCE
  # ============================================================================

  provider_evidence:

    required: true

    directory: "/docs/providers"

    files:
      google: "/docs/providers/google-rbm.md"
      infobip: "/docs/providers/infobip.md"
      twilio: "/docs/providers/twilio.md"
      sinch: "/docs/providers/sinch.md"
      zenvia: "/docs/providers/zenvia.md"

    required_content:
      - "review date"
      - "official sources"
      - "API version"
      - "authentication"
      - "credentials"
      - "endpoints"
      - "message capabilities"
      - "events"
      - "webhooks"
      - "security"
      - "limits"
      - "errors"
      - "billing"
      - "restrictions"


  # ============================================================================
  # 16 — SECRETS & CONFIGURATION
  # ============================================================================

  secrets:

    repository:
      commit_real_env: false
      env_example_required: true

    provider_credentials:
      scope: "workspace"
      frontend_storage: false
      local_storage: false
      plaintext_database: false
      encrypted_database_storage: true
      logging: false

    UI:
      mask_saved_secrets: true
      reveal_existing_secret: false


  # ============================================================================
  # 17 — DATABASE
  # ============================================================================

  database:

    engine: "PostgreSQL"
    production_location: "VPS"
    public_access: false

    tenant_rule: >
      Toda entidade operacional pertencente a Workspace
      deve possuir workspace_id.

    entities:

      core:
        - "users"
        - "workspaces"
        - "workspace_members"

      contacts:
        - "contacts"
        - "contact_lists"
        - "contact_list_members"

      messaging:
        - "messages"
        - "message_versions"
        - "media_assets"

      campaigns:
        - "campaigns"
        - "campaign_recipients"

      journeys:
        - "journeys"
        - "journey_versions"
        - "journey_nodes"
        - "journey_edges"
        - "journey_enrollments"
        - "journey_events"

      scoring:
        - "lead_scores"
        - "lead_score_events"
        - "score_rules"

      providers:
        - "provider_connections"
        - "provider_credentials"
        - "provider_agents"
        - "provider_capabilities"

      communication:
        - "outbound_messages"
        - "inbound_messages"
        - "conversations"

      tracking:
        - "tracked_links"
        - "click_events"
        - "webhook_events"

      compliance:
        - "opt_outs"

      operations:
        - "audit_logs"

    security:
      least_privilege: true
      application_superuser: false
      encrypted_transport: true
      parameterized_queries: true

    migrations:
      versioned: true

    backup:
      automated: true
      encrypted: true
      restore_test_required: true


  # ============================================================================
  # 18 — CONTACTS & AUDIENCES
  # ============================================================================

  contacts:

    ownership: "workspace"

    input:
      manual: true
      CSV: true
      XLSX: true
      paste: true

    normalization:
      standard: "E.164"
      default_country: "BR"

    pipeline:
      - "sanitize"
      - "normalize"
      - "validate"
      - "deduplicate"
      - "check_opt_out"
      - "persist"

    properties:
      tags: true
      custom_fields: true
      lead_score: true
      journey_status: true


  audiences:

    ownership: "workspace"
    static_lists: true

    future:
      dynamic_segments: true


  # ============================================================================
  # 19 — MESSAGE DOMAIN
  # ============================================================================

  messages:

    ownership: "workspace"
    reusable: true
    versioned: true

    statuses:
      - "draft"
      - "active"
      - "archived"

    formats:
      MVP:
        - "text"
        - "rich_card"

      architecture_ready:
        - "media"
        - "carousel"
        - "file"

    message_archetypes:

      marketing:
        - "launch"
        - "offer"
        - "promotion"
        - "invitation"
        - "reengagement"
        - "recovery"

      transactional:
        - "confirmation"
        - "reminder"
        - "status_update"
        - "appointment"

      authentication:
        - "OTP"
        - "verification"
        - "password_reset"


  # ============================================================================
  # 20 — MESSAGE BUILDER
  # ============================================================================

  message_builder:

    fields:

      media:
        enabled: true

      title:
        enabled: true
        live_counter: true

      body:
        enabled: true
        live_counter: true

      actions:
        enabled: true

      suggested_replies:
        enabled: true

    action_destinations:
      - "website"
      - "landing_page"
      - "WhatsApp"
      - "custom_URL"
      - "journey_branch"

    preview:
      required: true
      live: true
      device_style: "mobile"

    validation:
      realtime: true
      provider_aware: true


  # ============================================================================
  # 21 — CAMPAIGNS
  # ============================================================================

  campaigns:

    purpose: >
      Disparo direto de mensagem para audiência.

    ownership: "workspace"

    states:
      - "draft"
      - "scheduled"
      - "ready"
      - "queued"
      - "running"
      - "paused"
      - "completed"
      - "cancelled"
      - "failed"

    flow:
      - "objective"
      - "provider"
      - "agent"
      - "audience"
      - "message"
      - "schedule"
      - "tracking"
      - "preflight"
      - "review"
      - "confirmation"

    controls:
      pause: true
      resume: true
      cancel: true
      emergency_stop: true


  # ============================================================================
  # 22 — JOURNEY DOMAIN
  # ============================================================================

  journeys:

    enabled: true
    ownership: "workspace"

    purpose: >
      Automatizar sequências de comunicação individualizadas,
      nas quais cada contato avança de acordo com eventos,
      comportamento, condições, tempo e regras.

    states:
      - "draft"
      - "validating"
      - "published"
      - "active"
      - "paused"
      - "archived"

    versioning:
      required: true

    rule: >
      Journey publicada é imutável em sua versão ativa.

      Alterações estruturais geram nova versão.

      Contatos já matriculados permanecem associados
      à versão correspondente, salvo processo explícito
      e seguro de migração.


  # ============================================================================
  # 23 — VISUAL FLOW BUILDER
  # ============================================================================

  flow_builder:

    enabled: true

    UX:
      type: "node_based_visual_editor"

    features:
      - "drag and drop"
      - "zoom"
      - "pan"
      - "connect nodes"
      - "delete connection"
      - "duplicate node"
      - "node configuration panel"
      - "validation indicators"
      - "minimap"
      - "autosave draft"
      - "undo"
      - "redo"

    save_model:
      nodes: true
      edges: true
      viewport: true
      version: true

    publish:
      requires_validation: true
      explicit_confirmation: true


  # ============================================================================
  # 24 — JOURNEY NODE TYPES
  # ============================================================================

  journey_nodes:

    start:

      purpose: "Entry point"

      allowed_count:
        min: 1
        max: 1


    message:

      purpose: "Send RCS message"

      configuration:
        message_id: true
        provider_connection: true
        agent: true


    wait:

      purpose: "Delay execution"

      modes:
        - "duration"
        - "until_datetime"

      units:
        - "minutes"
        - "hours"
        - "days"


    condition:

      purpose: "Evaluate condition"

      examples:
        - "message_delivered"
        - "message_read"
        - "message_failed"
        - "link_clicked"
        - "action_selected"
        - "message_received"
        - "has_tag"
        - "lead_score"
        - "custom_field"
        - "opt_out_status"


    branch:

      purpose: "Route contact"

      supports_multiple_paths: true


    tag:

      purpose: "Manage contact tag"

      actions:
        - "add"
        - "remove"


    score:

      purpose: "Modify lead score"

      actions:
        - "increase"
        - "decrease"
        - "set"


    webhook:

      purpose: >
        Send controlled event to external system.

      security:
        HTTPS_required: true
        timeout_required: true
        retry_policy: true
        SSRF_protection: true


    goal:

      purpose: "Mark business objective"

      examples:
        - "hot_lead"
        - "sales_ready"
        - "appointment_requested"
        - "converted"


    end:

      purpose: "Terminate journey path"


  # ============================================================================
  # 25 — JOURNEY GRAPH RULES
  # ============================================================================

  journey_graph:

    directed: true

    validation:

      required_before_publish: true

      rules:
        - "exactly one start node"
        - "start node has no incoming edges"
        - "all executable nodes reachable"
        - "invalid orphan nodes blocked"
        - "message nodes reference active messages"
        - "provider capabilities compatible"
        - "condition paths valid"
        - "wait configuration valid"
        - "goal configuration valid"
        - "end path available where required"

    cycles:

      default_policy: "restricted"

      rule: >
        Ciclos não podem ser criados livremente.

        Loops futuros devem possuir limite explícito
        de iterações e proteção contra execução infinita.


  # ============================================================================
  # 26 — JOURNEY ENROLLMENT
  # ============================================================================

  journey_enrollments:

    purpose: >
      Representar a execução individual de um contato
      dentro de uma versão específica de Journey.

    fields:
      - "id"
      - "workspace_id"
      - "journey_id"
      - "journey_version_id"
      - "contact_id"
      - "current_node_id"
      - "status"
      - "entered_at"
      - "last_activity_at"
      - "completed_at"

    statuses:
      - "active"
      - "waiting"
      - "completed"
      - "converted"
      - "stopped"
      - "opted_out"
      - "failed"

    critical_rule: >
      Cada contato possui estado individual.

      O avanço de um contato nunca deve mover
      outro contato dentro da Journey.


  # ============================================================================
  # 27 — JOURNEY ENTRY
  # ============================================================================

  journey_entry:

    supported_sources:
      - "contact_list"
      - "campaign"
      - "tag_added"
      - "manual"
      - "API_event"
      - "future_external_event"

    duplicate_enrollment:

      configurable: true

      default: "prevent_active_duplicate"


  # ============================================================================
  # 28 — EVENT MODEL
  # ============================================================================

  canonical_events:

    messaging:
      - "message.sent"
      - "message.delivered"
      - "message.read"
      - "message.failed"
      - "message.received"

    actions:
      - "action.selected"
      - "link.clicked"

    contact:
      - "contact.tag_added"
      - "contact.tag_removed"
      - "contact.subscribe"
      - "contact.unsubscribe"

    campaign:
      - "campaign.started"
      - "campaign.completed"

    journey:
      - "journey.entered"
      - "journey.node_entered"
      - "journey.node_completed"
      - "journey.goal_reached"
      - "journey.completed"

    scoring:
      - "lead.score_changed"
      - "lead.qualified"


  # ============================================================================
  # 29 — EVENT BUS
  # ============================================================================

  event_bus:

    required: true

    principle: >
      Provider events são normalizados para eventos canônicos
      antes de serem utilizados pelo domínio.

    consumers:
      - "campaign_engine"
      - "journey_engine"
      - "analytics"
      - "scoring"
      - "conversations"
      - "audit"

    requirements:
      idempotent_consumers: true
      workspace_context: true
      correlation_id: true


  # ============================================================================
  # 30 — JOURNEY ENGINE
  # ============================================================================

  journey_engine:

    required: true
    provider_independent: true
    asynchronous: true
    event_driven: true

    responsibilities:
      - "enroll contact"
      - "load current node"
      - "execute node"
      - "persist state"
      - "wait for events"
      - "resume execution"
      - "evaluate conditions"
      - "select branch"
      - "dispatch message"
      - "update tags"
      - "update score"
      - "execute outbound webhook"
      - "reach goal"
      - "complete enrollment"

    execution_loop:

      - "receive trigger"
      - "resolve workspace"
      - "load enrollment"
      - "lock enrollment"
      - "verify status"
      - "load journey version"
      - "load current node"
      - "execute node"
      - "persist node result"
      - "determine next node"
      - "persist next state"
      - "emit canonical event"
      - "schedule next work if necessary"
      - "release lock"

    concurrency:
      enrollment_lock_required: true

    idempotency:
      required: true

    rule: >
      O mesmo evento não pode fazer o mesmo contato
      avançar duas vezes pelo mesmo transition.


  # ============================================================================
  # 31 — WAIT ENGINE
  # ============================================================================

  wait_engine:

    required: true

    queue_backed: true

    supported:
      duration: true
      absolute_datetime: true

    persistence:
      database_is_source_of_truth: true

    rule: >
      Redis/BullMQ auxilia execução.

      O estado crítico da Journey não pode existir
      exclusivamente em Redis.

      Reiniciar worker ou Redis não pode destruir
      permanentemente a posição do contato.


  # ============================================================================
  # 32 — CONDITION ENGINE
  # ============================================================================

  condition_engine:

    required: true

    operators:

      generic:
        - "equals"
        - "not_equals"
        - "exists"
        - "not_exists"

      numeric:
        - "greater_than"
        - "greater_or_equal"
        - "less_than"
        - "less_or_equal"

      collection:
        - "contains"
        - "not_contains"

    sources:
      - "contact"
      - "message_event"
      - "lead_score"
      - "tag"
      - "custom_field"
      - "journey_context"

    provider_capability_rule: >
      Condições dependentes de evento específico só podem
      ser publicadas quando o provider/agent selecionado
      comprovar suporte ao evento correspondente.


  # ============================================================================
  # 33 — LEAD SCORING
  # ============================================================================

  lead_scoring:

    enabled: true
    workspace_scoped: true

    default_rules:
      message_delivered: 1
      message_read: 2
      link_clicked: 5
      action_selected: 5
      message_received: 15
      appointment_requested: 30

    configurable:
      enabled: true

    classifications:

      cold:
        min: 0
        max: 9

      warm:
        min: 10
        max: 24

      hot:
        min: 25
        max: 49

      sales_ready:
        min: 50

    history:
      required: true

    every_change_records:
      - "workspace_id"
      - "contact_id"
      - "source"
      - "event"
      - "delta"
      - "previous_score"
      - "new_score"
      - "timestamp"


  # ============================================================================
  # 34 — JOURNEY GOALS
  # ============================================================================

  journey_goals:

    supported: true

    examples:
      - "clicked_offer"
      - "requested_information"
      - "requested_appointment"
      - "hot_lead"
      - "sales_ready"
      - "converted"

    actions_on_goal:
      - "mark_enrollment"
      - "emit_event"
      - "add_tag"
      - "change_score"
      - "optional_external_webhook"
      - "optional_end_journey"


  # ============================================================================
  # 35 — EXTERNAL WEBHOOK ACTION
  # ============================================================================

  journey_external_webhook:

    enabled: true

    use_cases:
      - "send qualified lead to CRM"
      - "notify external application"
      - "trigger downstream automation"

    security:

      HTTPS_only: true
      SSRF_protection: true
      block_private_networks_by_default: true
      timeout: true
      response_size_limit: true
      retry_policy: true
      secret_headers_encrypted: true

    future_examples:
      - "KLEAD"
      - "external CRM"
      - "automation platform"


  # ============================================================================
  # 36 — OPT-OUT BEHAVIOR
  # ============================================================================

  opt_out:

    global_within_workspace: true

    enforcement:
      campaigns: true
      journeys: true

    journey_behavior: >
      Ao receber opt-out válido, cancelar mensagens futuras
      aplicáveis e alterar enrollment para opted_out
      quando necessário.

    immediate_recheck_before_send: true


  # ============================================================================
  # 37 — CAMPAIGN ENGINE
  # ============================================================================

  campaign_engine:

    provider_independent: true
    asynchronous: true
    workspace_scoped: true

    queue:
      required: true

    workers:
      required: true

    controls:
      concurrency: true
      provider_rate_limit: true
      pause: true
      resume: true
      cancel: true
      emergency_stop: true

    pipeline:
      - "load workspace"
      - "load campaign"
      - "validate state"
      - "load recipient"
      - "recheck opt-out"
      - "resolve provider"
      - "validate capabilities"
      - "check idempotency"
      - "load canonical message"
      - "translate through adapter"
      - "send"
      - "normalize result"
      - "persist"
      - "emit event"


  # ============================================================================
  # 38 — WEBHOOK ARCHITECTURE
  # ============================================================================

  webhooks:

    route:
      pattern: "/webhooks/rcs/{provider}"

    ingress:
      - "resolve provider"
      - "validate request size"
      - "verify provider-specific signature"
      - "resolve provider connection"
      - "resolve workspace"
      - "persist raw event securely"
      - "deduplicate"
      - "enqueue"
      - "respond"

    processing:
      - "load raw event"
      - "provider parse"
      - "normalize event"
      - "domain idempotency"
      - "persist event"
      - "publish canonical event"

    canonical_event_consumers:
      - "campaign engine"
      - "journey engine"
      - "lead scoring"
      - "analytics"
      - "conversations"
      - "audit"


  # ============================================================================
  # 39 — RATE LIMIT / RETRY / IDEMPOTENCY
  # ============================================================================

  rate_limits:
    provider_specific: true
    workspace_aware: true
    documentation_driven: true

  retry:

    temporary:
      strategy: "exponential_backoff_with_jitter"

    permanent:
      retry: false

    dead_letter_queue:
      required: true

  idempotency:

    campaign_send:
      required: true

    journey_node_execution:
      required: true

    journey_transition:
      required: true

    webhook:
      required: true

    score_event:
      required: true


  # ============================================================================
  # 40 — ANALYTICS
  # ============================================================================

  analytics:

    campaign_metrics:
      - "sent"
      - "delivered"
      - "read"
      - "clicked"
      - "replied"
      - "failed"
      - "opted_out"

    journey_metrics:
      - "enrolled"
      - "active"
      - "waiting"
      - "completed"
      - "converted"
      - "opted_out"
      - "failed"

    journey_node_metrics:
      - "entered"
      - "completed"
      - "conversion"
      - "dropoff"

    funnel_visualization:
      enabled: true

    lead_metrics:
      - "cold"
      - "warm"
      - "hot"
      - "sales_ready"


  # ============================================================================
  # 41 — JOURNEY OBSERVABILITY
  # ============================================================================

  journey_observability:

    contact_timeline:
      enabled: true

    display:
      - "journey entered"
      - "message sent"
      - "message delivered"
      - "message read"
      - "link clicked"
      - "action selected"
      - "reply received"
      - "score changed"
      - "branch selected"
      - "goal reached"
      - "journey completed"

    debug_view:
      enabled_for_authorized_users: true


  # ============================================================================
  # 42 — SECURITY
  # ============================================================================

  security:

    standards:
      - "OWASP ASVS"
      - "OWASP Top 10"

    principles:
      - "least privilege"
      - "defense in depth"
      - "secure by default"
      - "fail closed"
      - "tenant isolation"

    protections:
      SQL_injection: true
      XSS: true
      command_injection: true
      CSRF_when_applicable: true
      SSRF: true
      path_traversal: true
      webhook_replay: true
      forged_webhook: true
      IDOR: true
      cross_tenant_access: true

    journey_specific:

      infinite_loop_protection: true
      duplicate_execution_protection: true
      enrollment_locking: true
      webhook_SSRF_protection: true
      max_execution_guards: true

    privacy:
      LGPD: true
      data_minimization: true
      sensitive_log_redaction: true


  # ============================================================================
  # 43 — DESIGN SYSTEM
  # ============================================================================

  design_system:

    name: "Purple Signal"
    default_theme: "dark"

    colors:

      brand:
        purple_400: "#C084FC"
        purple_500: "#A855F7"
        purple_600: "#9333EA"
        purple_700: "#7E22CE"

      dark:
        background: "#09090B"
        surface: "#111116"
        elevated: "#18181F"
        border: "#27272F"
        text_primary: "#FAFAFA"
        text_secondary: "#A1A1AA"

      semantic:
        success: "#22C55E"
        warning: "#F59E0B"
        error: "#EF4444"
        info: "#3B82F6"

    gradient:
      primary: >
        linear-gradient(
          135deg,
          #7E22CE 0%,
          #A855F7 50%,
          #C084FC 100%
        )

    typography:
      primary: "Inter"
      mono: "Geist Mono"

    journey_canvas:

      requirements:
        - "dark canvas"
        - "subtle grid"
        - "clear connectors"
        - "selected node highlight"
        - "node status indicators"
        - "validation errors"
        - "zoom controls"
        - "minimap"

      node_visual_types:
        start: "distinct"
        message: "distinct"
        wait: "distinct"
        condition: "distinct"
        action: "distinct"
        goal: "distinct"
        end: "distinct"

    accessibility:
      target: "WCAG AA"


  # ============================================================================
  # 44 — DOCUMENTATION
  # ============================================================================

  documentation:

    required: true
    primary_language: "pt-BR"

    files:
      - "/README.md"
      - "/.env.example"
      - "/SECURITY.md"
      - "/CHANGELOG.md"
      - "/docs/architecture.md"
      - "/docs/workspaces.md"
      - "/docs/campaigns.md"
      - "/docs/journeys.md"
      - "/docs/journey-engine.md"
      - "/docs/lead-scoring.md"
      - "/docs/events.md"
      - "/docs/providers/"
      - "/docs/webhooks.md"
      - "/docs/local-development.md"
      - "/docs/vps-installation.md"
      - "/docs/security.md"
      - "/docs/backup-restore.md"
      - "/docs/troubleshooting.md"


  # ============================================================================
  # 45 — README
  # ============================================================================

  readme:

    required: true

    banner:
      required: true
      design_system: "Purple Signal"
      style: "dark technological professional clean"

    audience:
      - "beginner"
      - "non_developer"
      - "developer"
      - "VPS_operator"

    required_sections:
      - "project overview"
      - "campaigns versus journeys"
      - "features"
      - "architecture"
      - "technology stack"
      - "installation"
      - "configuration"
      - "PostgreSQL"
      - "Redis"
      - "providers"
      - "webhooks"
      - "journey engine"
      - "lead scoring"
      - "VPS deployment"
      - "domain and HTTPS"
      - "security"
      - "backup"
      - "updates"
      - "rollback"
      - "troubleshooting"

    beginner_mode:

      every_major_step:
        - "objective"
        - "exact command"
        - "expected result"
        - "verification"
        - "common errors"


  # ============================================================================
  # 46 — DEPLOYMENT
  # ============================================================================

  deployment:

    target: "VPS"

    local_Docker_required: false

    production_containerization:
      mandatory: false
      supported: true

    initial_OS: "Ubuntu LTS"

    PostgreSQL:
      strategy: "existing VPS PostgreSQL"

    Redis:
      required: true

    domain:
      hardcoded: false
      configured_at_deployment: true

    webhook_URL:
      hardcoded: false
      configured_at_deployment: true


  # ============================================================================
  # 47 — TESTING
  # ============================================================================

  testing:

    unit: true
    integration: true
    E2E: true
    security: true

    provider_contract_tests:
      required: true

    tenant_isolation_tests:
      required: true

    journey_tests:

      required:
        - "enrollment"
        - "message node"
        - "wait node"
        - "condition"
        - "branch"
        - "tag action"
        - "score action"
        - "goal"
        - "end"
        - "event resume"
        - "duplicate event"
        - "duplicate transition"
        - "worker restart"
        - "Redis interruption"
        - "opt-out during journey"
        - "provider failure"
        - "invalid capability"
        - "cross-workspace access"

    flow_builder_tests:
      required:
        - "create node"
        - "delete node"
        - "connect nodes"
        - "save draft"
        - "reload graph"
        - "validate graph"
        - "publish graph"
        - "version graph"


  # ============================================================================
  # 48 — CI/CD
  # ============================================================================

  CI_CD:

    checks:
      - "typecheck"
      - "lint"
      - "unit tests"
      - "integration tests"
      - "journey engine tests"
      - "tenant isolation tests"
      - "provider contract tests"
      - "security scan"
      - "dependency scan"
      - "secret scan"
      - "build"
      - "documentation check"

    rollback:
      required: true


  # ============================================================================
  # 49 — EXECUTION LOOP
  # ============================================================================

  execution:

    autonomy_mode: "high"

    before_each_wave:
      - "read MASTER-SPEC.yaml"
      - "inspect repository"
      - "identify current wave"
      - "inspect dependencies"
      - "inspect workspace impact"
      - "inspect security impact"
      - "inspect provider impact"
      - "inspect documentation impact"
      - "create implementation plan"

    loop:
      1: "inspect"
      2: "research official docs when necessary"
      3: "plan"
      4: "implement"
      5: "typecheck"
      6: "lint"
      7: "unit test"
      8: "integration test"
      9: "tenant isolation test"
      10: "security test"
      11: "inspect result"
      12: "fix"
      13: "retest"
      14: "validate acceptance criteria"
      15: "update documentation"
      16: "close wave"

    forbidden:
      - "invent provider API"
      - "invent provider events"
      - "invent webhook authentication"
      - "bypass provider abstraction"
      - "bypass workspace isolation"
      - "skip failing tests"
      - "disable security to pass test"
      - "commit secrets"
      - "hardcode production domain"
      - "require Docker locally"
      - "store journey state only in Redis"
      - "allow uncontrolled journey loops"


  # ============================================================================
  # 50 — WAVES
  # ============================================================================

  construction_validation:
    checked_at: "2026-10-04"
    status: "local_construction_complete_through_wave_29"
    scope: "Implementation and local verification; not external production acceptance. Earlier execution_notes retain historical checks."
    migrations: 34
    tests_passed: 442
    native_domain_checks_passed: 9
    chromium_scenarios_passed: 7
    clean_frozen_install_and_build: "passed"
    native_backup_and_isolated_restore: "passed"
    build_types_lint_release_checks: "passed"
    evidence: "docs/validation.md"
    later_operational_validation:
      - "Provider credentials, account/agent activation and real delivery"
      - "Docker/VPS installation, public HTTPS and deployment/rollback"
    unsupported_capabilities: "PDF and optional vendor operations without implemented documented contracts remain blocked."

  waves:

    wave_0:
      name: "Environment & Spec Validation"

    wave_1:
      name: "Engineering Foundation"

    wave_2:
      name: "Authentication & Workspace Foundation"

    wave_3:
      name: "Security Foundation"

    wave_4:
      name: "Purple Signal Design System"

    wave_5:
      name: "Provider Core"

    wave_6:
      name: "Mock Provider"

    wave_7:
      name: "First Real Provider Proof"

      blocking: false

      clarification: >
        Orientação do titular: construir o app e os adaptadores conforme a
        documentação oficial das empresas de RCS. Credenciais e testes reais
        serão usados posteriormente e não bloqueiam a construção dos módulos.

      documentation_first: true

    wave_8:
      name: "Contacts & Audiences"

    wave_9:
      name: "Eligibility Engine"
      execution_status: "implemented_locally_sync_google_infobip_async_sinch_checks"
      execution_notes:
        - "Workspace-scoped contact/connection eligibility API and migration 006 implemented; supported adapters use checkEligibility without sending messages."
        - "Unknown/unsupported capability remains unknown; persistent opt-out blocks the contact and is rechecked at commit."
        - "Latest-attempt reservation, credential/revision checks, atomic audit, role reauthorization and an eight-second local deadline protect asynchronous results."
        - "Five-minute local validity is application policy, not a provider guarantee. No automatic cached-result reuse or bulk/provider-managed strategy implemented."
        - "Build, package/E2E types, lint and 121 local tests passed; four external-service and two Google live tests skipped. No native PostgreSQL concurrency, browser E2E or external-provider execution for this module."
        - "Campaign and Journey runtime integrations are implemented; final native checks cover Sinch callback correlation. See docs/eligibility.md."

    wave_10:
      name: "Media Service"
      execution_status: "implemented_locally_private_images_and_scoped_provider_grants"
      execution_notes:
        - "Migration 007 and workspace-scoped upload/list/authenticated binary access implemented behind MediaStore; initial private PostgreSQL bytea storage."
        - "Static PNG/JPEG/WebP only; canonical base64, signature/MIME checks, full decode/reencode, orientation and original metadata removal with Sharp."
        - "Local policy: 2-MiB input/output, 4096x4096 dimensions, 3-MiB JSON, two processing uploads per API instance, five-second pixel-processing timeout. These are not provider quotas."
        - "Roles rechecked before decoding and persistence; composite ownership and atomic audit protect metadata/content. Animated PNG/WebP, SVG, remote URL imports and unsupported formats rejected."
        - "Build, package/E2E types, lint and 136 local tests passed across checks; four external-service and two Google live tests skipped. Production dependency audit found no known vulnerabilities."
        - "First complete run hit the default five-second timeout on an existing test performing eleven real password checks under concurrent WASM SQL load; its timeout was set to fifteen seconds and all API tests passed on rerun."
        - "Scoped expiring provider media grants and visual selection are implemented and natively tested. Storage remains private PostgreSQL; no external delivery proof. See docs/media.md."

    wave_11:
      execution_status: "implemented_locally_versioned_message_core"
      execution_notes:
        - "Migration 008: immutable snapshots, draft/active/archived states, explicit activation, optimistic content revision conflicts and workspace media references."
        - "Text and single rich card API with reply/HTTPS suggestions. Local application limits; activation does not establish provider send readiness."
        - "Eleven domain/SQL/HTTP tests and one proxy test. Native PostgreSQL concurrency, browser E2E and external sending not executed for this module."
        - "Build, package/E2E type checks, lint and all 148 local tests passed; four external-service and two manual Google tests skipped."
        - "Library, builder, archetype categories, carousel and capability validation are implemented locally. See docs/messages.md."
      name: "Message Domain"

    wave_12:
      name: "Message Library"
      execution_status: "implemented_locally_initial_library"
      execution_notes:
        - "Workspace library and detail pages: status filters, 50-item pagination, historical/current/active previews and private media rendering."
        - "Text draft creation with preview, explicit activation, archive/restore and duplication of the latest snapshot as a new draft. Readers have no mutation controls."
        - "Workspace changes return message details to the new workspace library and clear version/pagination. API permission and conflict enforcement reused."
        - "Sixteen web tests, web build/lint and E2E type checks passed. One additional Playwright scenario prepared/discovered but not executed; no local Chromium or external PostgreSQL/Redis."
        - "Editing builder, media selection/upload, archetype categories and provider capability comparison are implemented locally. See docs/messages.md."

    wave_13:
      name: "Message Builder"
      execution_status: "implemented_locally_categories_carousel_media_and_journey_branch_builder"
      execution_notes:
        - "Create/edit text and single rich card snapshots with live mobile-style preview, Unicode counters, HTTPS actions and suggested replies placed on card or message."
        - "Private image upload/selection/removal through Media Service with pagination. Upload and message save are separate persisted operations."
        - "Optimistic revision saves preserve the active version. Archived and historical snapshots are read-only; current versions editable by messages.manage roles."
        - "Read-only provider-options endpoint exposes adapter names, activation, capabilities and limits without credentials or evidence. Local comparison distinguishes unknown from unsupported; never blocks draft creation."
        - "Build, package/E2E types, lint and 156 local tests passed. Six external tests skipped. Playwright scenario updated/discovered but not executed; no browser visual inspection or native PostgreSQL concurrency."
        - "Archetype categories, carousel/media/image-file drafts, Journey branch selection and agent/recipient-aware dispatch validation are implemented. PDF and unsupported vendor operations remain blocked. No external-provider send performed."

    wave_14:
      name: "Campaign Domain"
      execution_status: "implemented_locally_campaign_drafts_and_ui"
      execution_notes:
        - "Migration 009: workspace-scoped draft configuration, optimistic revisions, pinned message snapshot, provider/agent/list references, UTC schedule configuration and draft cancellation."
        - "Nine runtime states reserved; API produces only draft/cancelled. Non-draft configuration frozen; referenced audience lists preserved with HTTP 409 on deletion."
        - "Read-only local review reports opt-outs, missing configuration, cached connection status, bound-agent mismatch, active message snapshot, declared adapter capabilities/limits and expired schedule."
        - "Review always returns executionAvailable=false and runtime_not_available. Remaining audience does not establish consent or RCS eligibility; no provider API calls."
        - "Build, package/E2E type checks, lint and 168 local tests passed; six external tests skipped. Campaign/contact integration rerun passed 21 tests after list-deletion handling."
